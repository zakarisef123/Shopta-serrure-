# Le site est régénéré à chaque déploiement (photos, logos, sitemap).
[build]
  command = "pip install -q -r requirements.txt && python3 _src/build.py"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.12"

# Les sources du générateur ne sont pas publiques
[[redirects]]
  from = "/_src/*"
  to = "/404.html"
  status = 404
  force = true

# CSS et JS : versionnés par ?v=<empreinte>, donc mis en cache longtemps sans risque
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Images : revalidées à chaque visite (un logo peut être remplacé sous le même nom)
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
