# Le site est régénéré à chaque déploiement (photos, logos, sitemap).
[build]
  command = "pip install -q -r requirements.txt && python3 _src/build.py"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.12"

# Les sources du générateur ne sont pas publiques
[[redirects]]
  from = "/_src/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
